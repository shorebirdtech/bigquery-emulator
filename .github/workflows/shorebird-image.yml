# Builds and publishes ghcr.io/shorebirdtech/bigquery-emulator:X.Y.Z-shorebird.N
# for a vX.Y.Z-shorebird.N tag. Upstream's workflows are removed on this branch:
# its release workflow runs GoReleaser on every v* tag.
name: image
on:
  push:
    tags:
      - "v*-shorebird.*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ghcr.io/shorebirdtech/bigquery-emulator:${{ steps.version.outputs.version }}
