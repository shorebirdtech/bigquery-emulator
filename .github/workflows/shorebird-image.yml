# Builds and publishes ghcr.io/shorebirdtech/bigquery-emulator:X.Y.Z-shorebird.N
# for a vX.Y.Z-shorebird.N tag. Upstream's workflows are removed on this branch:
# its release workflow runs GoReleaser on every v* tag.
name: image
on:
  push:
    tags:
      - "v*-shorebird.*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ghcr.io/shorebirdtech/bigquery-emulator:${{ steps.version.outputs.version }}
